name: Proposal / RFC
description: Propose a substantive change to the MOEPA model, scoring, or governance approach.
title: "[RFC] "
labels: ["proposal", "rfc"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for changes that affect the layer model, the scoring rubric, or the governance approach.
        For small wording fixes, open a pull request instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What gap, inconsistency, or limitation does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the change as concretely as possible.
    validations:
      required: true
  - type: dropdown
    id: layers
    attributes:
      label: Layers affected
      multiple: true
      options:
        - Metrology
        - Ontology
        - Epistemology
        - Praxeology
        - Axiology
        - Cross-cutting / Catalog
        - None / Documentation only
    validations:
      required: true
  - type: dropdown
    id: scoring-impact
    attributes:
      label: Does this change scoring semantics?
      options:
        - "No"
        - "Yes"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Other approaches you weighed and why you rejected them.
    validations:
      required: false
